# Dependabot configuration pour WavLM Vocoder French
---
version: 2
updates:
  # 1. DÉPENDANCES PYTHON
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "isort"
          - "coverage"
          - "mypy"
      data-science:
        patterns:
          - "matplotlib"
          - "seaborn"
          - "pandas"
          - "scikit-learn"
          - "jupyter*"
          - "ipython"
          - "notebook"
          - "pillow"
          - "tqdm"
          - "pyyaml"
          - "omegaconf"
          - "hydra*"
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "torchaudio"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "librosa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    rebase-strategy: "auto"

  # 2. GITHUB ACTIONS
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
