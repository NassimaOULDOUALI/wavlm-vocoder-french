name: CI - Tests WavLM Vocoder

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-extra libavutil-dev libavformat-dev libavcodec-dev
        ffmpeg -version
        
    - name: Upgrade pip and install tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .
        pip list  # Affiche toutes les dépendances installées
        
    - name: Debug - Check Python path
      run: |
        python -c "
        import sys
        import os
        print('Python version:', sys.version)
        print('Python path:', sys.path)
        print('Current directory:', os.getcwd())
        print('Directory contents:', os.listdir('.'))
        if os.path.exists('src'):
            print('src contents:', os.listdir('src'))
        if os.path.exists('03_ablation_study/src'):
            print('03_ablation_study/src contents:', os.listdir('03_ablation_study/src'))
        "
        
    - name: Debug - Test imports
      run: |
        python -c "
        try:
            import torch
            print('✅ torch:', torch.__version__)
        except Exception as e:
            print('❌ torch import error:', e)
            
        try:
            import transformers
            print('✅ transformers:', transformers.__version__)
        except Exception as e:
            print('❌ transformers import error:', e)
            
        try:
            from src.losses import CombinedGANLoss
            print('✅ CombinedGANLoss imported from src.losses')
        except Exception as e:
            print('❌ src.losses.CombinedGANLoss import error:', e)
            
        try:
            from losses import CombinedGANLoss
            print('✅ CombinedGANLoss imported from losses')
        except Exception as e:
            print('❌ losses.CombinedGANLoss import error:', e)
        "
        
    - name: Run tests with verbose output
      run: |
        pytest tests/ -v -s --tb=long --maxfail=1
      env:
        PYTHONPATH: ${{ github.workspace }}
        PYTHONUNBUFFERED: 1
        
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.python-version }}
        path: |
          pytest.log
          /home/runner/.pytest_cache/
        retention-days: 7
        if-no-files-found: warn
