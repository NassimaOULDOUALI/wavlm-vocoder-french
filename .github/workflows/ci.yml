name: CI - Tests WavLM Vocoder

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Permet d'annuler les runs en cours si un nouveau push est fait
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    
    strategy:
      fail-fast: false  # Continue les autres tests même si un échoue
      matrix:
        os: [ubuntu-latest]  # ou ajoutez macos-latest, windows-latest si besoin
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Récupère tout l'historique pour les version tags
      
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'  # Cache automatique des dépendances
        cache-dependency-path: |
          requirements.txt
          setup.py
      
    - name: Install system dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-extra libavutil-dev libavformat-dev libavcodec-dev
        ffmpeg -version  # Vérification
      
    - name: Display Python version
      run: python --version
      
    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip list
      
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .  # Installation en mode développement
        
    - name: List installed packages
      run: pip list
      
    - name: Check code syntax
      run: |
        find . -name "*.py" ! -path "./.git/*" ! -path "./venv/*" -exec python -m py_compile {} \;
        echo "✅ Syntax check passed"
      
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      env:
        PYTHONPATH: ${{ github.workspace }}
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      
    - name: Test minimal inference
      run: |
        python -c "
        import torch
        import sys
        sys.path.append('src')
        try:
            from models.generator import HiFiGeneratorImproved
            model = HiFiGeneratorImproved(hidden_dim=32)
            print('✅ Model import successful')
            x = torch.randn(1, 32, 50)
            out = model(x)
            print(f'✅ Forward pass successful: {out.shape}')
        except Exception as e:
            print(f'❌ Error: {e}')
            raise
        "
      
    - name: Upload test logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          .pytest_cache/
          tests/__pycache__/
        retention-days: 7
