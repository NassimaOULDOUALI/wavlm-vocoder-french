name: CI - Tests WavLM Vocoder

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Permet d'annuler les runs en cours si un nouveau push est fait
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🐍 Python ${{ matrix.python-version }} sur Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false  # Continue les autres tests même si un échoue
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          setup.py
      
    - name: 📦 Install system dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          libavcodec-extra \
          libavutil-dev \
          libavformat-dev \
          libavcodec-dev \
          libsndfile1 \
          sox
        ffmpeg -version
        echo "✅ FFmpeg installed"
      
    - name: ⬆️ Upgrade pip and install tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade virtualenv
        echo "✅ Pip version: $(pip --version)"
      
    - name: 📚 Install version-specific dependencies
      run: |
        # Désactiver l'avertissement pip sur les nouvelles versions
        export PIP_ROOT_USER_ACTION=ignore
        
        # Installer les dépendances de base communes à toutes les versions
        pip install pytest pytest-cov pytest-xdist
        
        # Installation conditionnelle selon la version Python
        if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
          echo "🐍 Installing dependencies for Python 3.10"
          pip install numpy==1.24.3
          pip install contourpy==1.2.1
          pip install matplotlib==3.7.5
          pip install scipy==1.10.1
          pip install pandas==2.0.3
          pip install pillow==10.1.0
          
        elif [[ "${{ matrix.python-version }}" == "3.11" ]]; then
          echo "🐍 Installing dependencies for Python 3.11"
          pip install numpy==1.26.4
          pip install contourpy==1.3.0
          pip install matplotlib==3.8.4
          pip install scipy==1.11.4
          pip install pandas==2.1.4
          pip install pillow==10.2.0
          
        else  # Python 3.12
          echo "🐍 Installing dependencies for Python 3.12"
          pip install numpy==2.2.4
          pip install contourpy==1.3.3
          pip install matplotlib==3.10.1
          pip install scipy==1.15.2
          pip install pandas==2.2.3
          pip install pillow==11.2.1
        fi
        
        echo "✅ Base dependencies installed"
      
    - name: 📚 Install main requirements
      run: |
        # Installer le reste des dépendances depuis requirements.txt
        # avec gestion des erreurs pour les conflits potentiels
        pip install -r requirements.txt --upgrade || {
          echo "⚠️ Some packages failed, attempting individual installation..."
          
          # Installation individuelle des packages critiques
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.48.3
          pip install librosa==0.10.2.post1
          pip install soundfile==0.13.1
          pip install tensorboard==2.19.0
          pip install tqdm==4.67.1
          pip install pyyaml==6.0.2
          pip install hydra-core==1.3.2
          pip install omegaconf==2.3.0
        }
      
    - name: 📦 Install package in development mode
      run: |
        pip install -e .
        echo "✅ Package installed in development mode"
      
    - name: 📋 List installed packages
      run: |
        echo "📦 All installed packages:"
        pip list
      
    - name: 🔍 Debug - Check Python path and imports
      run: |
        python -c "
        import sys
        import os
        print('='*50)
        print('🔍 DEBUG INFORMATION')
        print('='*50)
        print(f'Python version: {sys.version}')
        print(f'Python path: {sys.path}')
        print(f'Current directory: {os.getcwd()}')
        print(f'Directory contents: {os.listdir(\".\")}')
        
        # Check critical modules
        critical_modules = ['torch', 'transformers', 'librosa', 'numpy', 'matplotlib']
        print('\n📦 Critical modules:')
        for module in critical_modules:
            try:
                exec(f'import {module}')
                version = eval(f'{module}.__version__')
                print(f'  ✅ {module}: {version}')
            except ImportError as e:
                print(f'  ❌ {module}: {e}')
        
        # Check project modules
        project_modules = ['src.models', 'src.dataset', 'src.training.losses']
        print('\n📁 Project modules:')
        for module in project_modules:
            try:
                exec(f'import {module}')
                print(f'  ✅ {module}')
            except ImportError as e:
                print(f'  ❌ {module}: {e}')
        "
      
    - name: 🧪 Run tests with pytest
      id: tests
      run: |
        # Exécuter tous les tests avec couverture
        pytest tests/ \
          -v \
          --tb=long \
          --maxfail=3 \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --durations=10 \
          -n auto \
          --dist loadscope
      env:
        PYTHONPATH: ${{ github.workspace }}
        PYTHONUNBUFFERED: 1
        OMP_NUM_THREADS: 2
        MKL_NUM_THREADS: 2
      
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
      if: success()
      
    - name: 🧪 Test minimal inference
      run: |
        python -c "
        import torch
        import sys
        sys.path.append('src')
        try:
            from models.generator import HiFiGeneratorImproved
            model = HiFiGeneratorImproved(hidden_dim=32)
            print('✅ Model import successful')
            x = torch.randn(1, 32, 50)
            out = model(x)
            print(f'✅ Forward pass successful: {out.shape}')
            
            # Test avec WavLM adapter
            from models.adapter import WavLMAdapterImproved
            adapter = WavLMAdapterImproved(wavlm_dim=768, hidden_dim=256)
            x2 = torch.randn(1, 50, 768)
            out2 = adapter(x2)
            print(f'✅ Adapter forward pass successful: {out2.shape}')
            
        except Exception as e:
            print(f'❌ Error: {e}')
            import traceback
            traceback.print_exc()
            sys.exit(1)
        "
      
    - name: 📈 Generate test summary
      if: always()
      run: |
        echo "## 📊 Test Summary for Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Status | Tests |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ Passed | ${{ steps.tests.outcome == 'success' && 'All' || 'Some' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See detailed logs in the CI run." >> $GITHUB_STEP_SUMMARY
      
    - name: 📤 Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-results.xml
          coverage.xml
        retention-days: 7
        if-no-files-found: ignore
      
    - name: 🚨 Notify on failure
      if: failure() && github.event_name == 'push'
      run: |
        echo "❌ Tests failed for Python ${{ matrix.python-version }}"
        echo "Check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
