name: Quick Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ develop ]

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install tools
      run: pip install black flake8
    - name: Black check
      run: black --check src/ tests/ || true
    - name: Flake8
      run: flake8 src/ --max-line-length=120 || true
